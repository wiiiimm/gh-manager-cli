name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger if needed

jobs:
  # Run semantic-release to create version, changelog, and tag
  semantic-release:
    # Only run if NOT a release commit
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Run semantic-release to handle versioning and changelog
          npx semantic-release
          
          # Check if a new version was created
          if [ -f ".semantic-release-version" ]; then
            VERSION=$(cat .semantic-release-version)
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT
            echo "::notice::Published version ${VERSION}"
          else
            # Check package.json for version changes as fallback
            VERSION=$(node -p "require('./package.json').version")
            if git diff HEAD~1 package.json | grep -q '"version"'; then
              echo "new_release_published=true" >> $GITHUB_OUTPUT
              echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT
              echo "::notice::Published version ${VERSION}"
            else
              echo "new_release_published=false" >> $GITHUB_OUTPUT
              echo "::notice::No new release published"
            fi
          fi

  # Build binaries for multiple platforms
  build:
    # Run only for release commits (when we have the new version)
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ''
          - os: macos-latest
            platform: macos
            arch: x64
            ext: ''
          - os: windows-latest
            platform: windows
            arch: x64
            ext: '.exe'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Create binary
        # node22: pkg-fetch v3.6 no longer ships node20-*-win-x64 (GMC-52).
        # Use the project-pinned @yao-pkg/pkg rather than a floating global latest.
        run: pnpm exec pkg dist/index.js --targets node22-${{ matrix.platform }}-${{ matrix.arch }} --output gh-manager-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gh-manager-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: gh-manager-cli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 90

  # Create GitHub release and upload binaries
  create-release:
    needs: build
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./binaries

      - name: Display downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la ./binaries/
          find ./binaries -type f -exec ls -la {} \;

      - name: Get version and changelog
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          
          # Extract changelog for this version.
          # NOTE: a naive awk range "/start/,/end/" collapses to a single line here,
          # because the version's own heading also matches the generic version-number
          # end pattern. Use a flag-based scan that consumes the start heading before
          # testing for the next version heading.
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(awk -v ver="$VERSION" '
              BEGIN { gsub(/\./, "\\.", ver) }   # match version dots literally, not as regex wildcards
              !started && $0 ~ ("^#+ \\[?" ver "\\]?") { started=1; print; next }
              started && /^#+ \[?[0-9]+\.[0-9]+\.[0-9]+\]?/ { exit }
              started { print }
            ' CHANGELOG.md)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="# Release v${VERSION}"
            fi
            # Save to file for GitHub release
            echo "$CHANGELOG" > release_notes.md
          else
            echo "# Release v${VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if release already exists
          if gh release view v${VERSION} > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
          else
            echo "Creating release v${VERSION}..."
            gh release create v${VERSION} \
              --title "v${VERSION}" \
              --notes-file release_notes.md \
              --verify-tag
          fi

      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Upload each binary
          for file in binaries/*/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename..."
              gh release upload v${VERSION} "$file" --clobber || echo "::warning::Failed to upload $filename"
            fi
          done

  # Publish to other registries and update Homebrew
  publish-extras:
    needs: create-release
    if: ${{ startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          echo "Publishing version ${VERSION} to GitHub Packages..."
          
          NPM_CONFIG_USERCONFIG=$(mktemp)
          PACKAGE_BACKUP=$(mktemp)
          cp package.json "$PACKAGE_BACKUP"
          export NPM_CONFIG_USERCONFIG
          trap 'cp "$PACKAGE_BACKUP" package.json; rm -f "$PACKAGE_BACKUP" "$NPM_CONFIG_USERCONFIG"' EXIT
          echo "@stealth-factory:registry=https://npm.pkg.github.com" > "$NPM_CONFIG_USERCONFIG"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"

          # Check if this version already exists in GitHub Packages
          if npm view @stealth-factory/gh-manager-cli@${VERSION} --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "::notice::Version ${VERSION} already exists in GitHub Packages, skipping publish"
            exit 0
          fi

          # Override the archive's publish registry and restore the checkout on exit.
          jq '.publishConfig.registry = "https://npm.pkg.github.com"' "$PACKAGE_BACKUP" > package.json
          TARBALL=$(npm pack --json --ignore-scripts | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")
          npm publish "$TARBALL" --registry=https://npm.pkg.github.com
          rm -f "$TARBALL"

      - name: Update Homebrew Tap
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if GH_TOKEN is available
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::warning::Homebrew tap update skipped: GH_TOKEN secret not configured"
            exit 0
          fi
          
          echo "Updating Homebrew tap for version ${VERSION}..."
          
          # Hash the exact public registry tarball that Homebrew will download.
          SHA256=$(bash scripts/brew-sha.sh "$VERSION" | awk '/^sha256:/ {print $2}')
          echo "SHA256: $SHA256"

          # Clone the tap repository with authentication
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/stealth-factory/homebrew-tap.git tap-repo
          
          # Update the formula
          FORMULA="tap-repo/Formula/gh-manager-cli.rb"
          node scripts/update-homebrew-formula.js "$FORMULA" "$VERSION" "$SHA256"

          # Commit and push
          cd tap-repo
          git add Formula/gh-manager-cli.rb
          git commit -m "chore: update gh-manager-cli to ${VERSION}" || echo "::notice::No changes to commit"
          git push origin main || echo "::warning::Failed to push Homebrew formula update"
